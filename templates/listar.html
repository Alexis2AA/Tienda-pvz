{% extends "inicio.html" %}
{% block content %}
<style>
    .table-bordered-gray {
        border: 1px solid #ccc; 
    }

    .table-bordered-gray th, .table-bordered-gray td {
        border: 1px solid #ccc; 
    }
</style>

<div class="container mt-5">
    <h1 class="text-center">Peluches disponibles</h1>
    <form method="POST" action="{{ url_for('listarc') }}" class="mb-4">
        <div class="input-group">
            <input type="text" name="buscar" class="form-control" placeholder="Buscar" value="{{ buscar_palabra }}">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>
    <div class="row">
        {% for fila in data %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="{{ fila[3] }}" alt="Imagen" height="330" width="330" class="card-img-top" alt="{{ fila[1] }} imagen">
                <div class="card-body text-center">
                            <h5 class="card-title">{{ fila[1] }}</h5>
                            <p class="card-text">Precio: ${{ fila[2] }}</p>
                    <form method="POST" action="{{ url_for('listarc') }}">
                        <input type="hidden" name="producto_id" value="{{ fila[0] }}">
                        <button type="submit" class="btn btn-primary">Agregar al carrito</button>
                    </form>
                    <br>
                    <p class="card-text">
                        <a href="{{ url_for('ver_producto', id=fila[0]) }}" class="btn btn-primary">Información</a>
                    </p>
                    
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
