<!DOCTYPE html>
<html>
<head>
    <title>Resultados de Búsqueda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Resultados de Búsqueda</h1>
        {% if resultados %}
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Puntaje</th>
                        <th>Equipo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for fila in data %}
                  <div class="col-md-4 mb-4">
                      <div class="card">
                          <img src="{{ fila[3] }}" alt="Imagen" height="220" width="250" class="card-img-top" alt="{{ fila[1] }} imagen">
                          <div class="card-body">
                              <h5 class="card-title">{{ fila[1] }}</h5>
                              <p class="card-text">
                                  <strong>Precio:</strong>{{" $ "}}{{fila[2]}}
                                  
                               
                              </p>
                          </div>
                      </div>
                  </div>
                  {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p>No se encontraron resultados para "{{ buscar_palabra }}".</p>
        {% endif %}
    </div>
</body>
</html>
