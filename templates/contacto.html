{% extends "inicio.html" %}
{% block content %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        background: url('/static/images/soporte.png') no-repeat center center fixed;
        background-size: cover;
    }
    .cajaconta2 {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 55vh; /* Altura completa de la ventana */
    }

    .container2 {
        background-color: rgba(255, 255, 255, 0.9); /* Fondo blanco con algo de transparencia */
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Sombra sutil para darle profundidad */
    }

    .form-label {
        font-weight: bold;
    }

    .btn-primary {
        width: 100%; /* Botón de envío de ancho completo */
    }
</style>
<div class="cajaconta2">
    <div class="container2 mt-5">
        <h1 class="text-center">Soporte técnico</h1>
        <form action="{{ url_for('enviar_mensaje') }}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje del error de la pagina</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</div>
{% endblock %}
